name: Nextapp PR Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build `nextapp`
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('nextapp/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Clean and install dependencies (allow native builds)
        run: |
          cd nextapp
          rm -rf node_modules package-lock.json
          npm install --unsafe-perm --legacy-peer-deps
          npm rebuild || true

      - name: Ensure LightningCSS native binary
        run: |
          cd nextapp
          # install platform-specific prebuilt binary for LightningCSS (matches package-lock)
          npm install lightningcss-linux-x64-gnu@1.30.1 --no-save || true
          npm rebuild lightningcss || true

      - name: Build
        run: |
          cd nextapp
          npm run build
        env:
          CI: true
