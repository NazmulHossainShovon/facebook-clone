name: Nextapp PR Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build `nextapp`
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('nextapp/package.json') }}-${{ hashFiles('nextapp/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('nextapp/package.json') }}-

      - name: Install dependencies
        run: |
          cd nextapp
          npm ci || npm install

      - name: Build
        run: |
          cd nextapp
          npm run build
        env:
          CI: true
